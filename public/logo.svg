<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <!-- Black rounded square background -->
  <rect width="500" height="500" rx="44" fill="#121214"/>
  
  <!-- Outer thin white frame line -->
  <rect x="22" y="22" width="456" height="456" rx="30" fill="none" stroke="#ffffff" stroke-width="8"/>
  
  <!-- Inner box containing V -->
  <rect x="160" y="68" width="180" height="180" rx="4" fill="none" stroke="#ffffff" stroke-width="10"/>
  
  <!-- Stylized bold white chevron V -->
  <polygon points="175,85 215,85 250,188 285,85 325,85 268,235 232,235" fill="#ffffff"/>
  
  <!-- VAGABOND text -->
  <text x="250" y="332" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="54" fill="#ffffff" text-anchor="middle" letter-spacing="4">VAGABOND</text>
  
  <!-- TOURS text -->
  <text x="250" y="394" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="54" fill="#ffffff" text-anchor="middle" letter-spacing="4">TOURS</text>
  
  <!-- CREATE HAPPINESS subtitle -->
  <text x="250" y="442" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="19" fill="#e4e4e7" text-anchor="middle" letter-spacing="7">CREATE HAPPINESS</text>
</svg>
